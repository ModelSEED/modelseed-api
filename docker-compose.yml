services:
  modelseed-api:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    image: modelseed-api:local
    ports:
      - "8000:8000"
    volumes:
      - modelseed-data:/data/modelseed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  modelseed-data:
