services:
  api:
    build:
      context: ..
      dockerfile: modelseed-api/Dockerfile
    container_name: modelseed-api-api-1
    ports:
      - "3004:8000"
    volumes:
      - modelseed-jobs:/tmp/modelseed-jobs
      # Read-only NFS bind for RAST job filesystem. Mounting /vol (not the
      # /vol/rast-prod/jobs symlink) so the container can resolve through
      # the symlink to the actual /vol/rast-prod-jobs-* shards. Read-only
      # at three layers: NFS server export, host kernel mount, and :ro flag.
      - /vol:/vol:ro
      # Pre-built RAST job index (job_id -> user metadata) so /api/rast/jobs
      # serves immediately at container startup instead of waiting on a
      # ~30-min walk of 1.6M dirs. Host-managed (built by a one-time script
      # or cron); container only reads.
      - /scratch/modelseed/rast_index:/var/cache/modelseed:ro
    environment:
      MODELSEED_USE_CELERY: "true"
      MODELSEED_CELERY_BROKER_URL: "redis://bioseed_redis:6379/10"
      MODELSEED_CELERY_RESULT_BACKEND: "redis://bioseed_redis:6379/10"
      MODELSEED_RAST_JOBS_DIR: "/vol/rast-prod/jobs"
      MODELSEED_RAST_INDEX_PATH: "/var/cache/modelseed/rast_user_index.json"
    restart: unless-stopped
    networks:
      - default
      - bioseed_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: modelseed-api/Dockerfile
    container_name: celery_modelseed
    command: ["python", "-m", "modelseed_api.jobs.celery_app"]
    volumes:
      - modelseed-jobs:/tmp/modelseed-jobs
      # Same RAST NFS bind as the api service (worker calls RastService too,
      # for the reconstruct task that uses rast_job_id).
      - /vol:/vol:ro
      # Same pre-built RAST index as the api service (worker doesn't list
      # jobs but mounting symmetrically keeps container parity simple).
      - /scratch/modelseed/rast_index:/var/cache/modelseed:ro
    environment:
      MODELSEED_USE_CELERY: "true"
      MODELSEED_CELERY_BROKER_URL: "redis://bioseed_redis:6379/10"
      MODELSEED_CELERY_RESULT_BACKEND: "redis://bioseed_redis:6379/10"
      MODELSEED_RAST_JOBS_DIR: "/vol/rast-prod/jobs"
      MODELSEED_RAST_INDEX_PATH: "/var/cache/modelseed/rast_user_index.json"
    restart: unless-stopped
    # Give a long-running task (reconstruct + gapfill ~6-10 min, FBA ~10 s)
    # time to finish on SIGTERM before docker SIGKILLs.  Without this,
    # Celery's prefork pool gets killed mid-LP-solve and acks_late can't
    # reliably requeue (Layer D test finding, 2026-05-04).
    stop_grace_period: 15m
    networks:
      - default
      - bioseed_network
    depends_on:
      - api

networks:
  default:
    driver: bridge
  bioseed_network:
    external: true

volumes:
  modelseed-jobs:
