[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelseed-api"
version = "1.0.0"
description = "Modern REST API backend for the ModelSEED metabolic modeling platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jose P. Faria"},
    {name = "Christopher Henry", email = "chenry@anl.gov"},
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.25.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
modeling = [
    # Pinned to the specific forks + commits CLAUDE.md requires. Plain
    # PyPI names would silently resolve to the wrong package: cobrakbase
    # on PyPI is stuck at a broken 0.3.0, kbutillib isn't on PyPI at all,
    # and modelseedpy on PyPI points at the org repo, not this fork.
    # Bump the SHA deliberately (git ls-remote <url> refs/heads/<branch>)
    # rather than tracking the branch, so installs stay reproducible.
    "kbutillib @ git+https://github.com/cshenry/KBUtilLib.git@0f8480327b52b208ea8aa366b9c738576162d912",
    "modelseedpy @ git+https://github.com/cshenry/ModelSEEDpy.git@b758b44217bca756a5e07a70e986fbdfe73dd1b6",
    "cobrakbase @ git+https://github.com/Fxe/cobrakbase.git@e7bbd3c37b96d44ac49b7b16dfa6fc08d355d4a7",
    "cobra>=0.29.0",
    "pymysql>=1.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    # E2E live test suite (see docs/E2E_TEST_PLAN.md)
    "pytest-html>=4.0.0",
    "pytest-json-report>=1.5.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "pytest-rerunfailures>=14.0",
    "tenacity>=8.2.0",
]
ui-tests = [
    "pytest-playwright>=0.5.0",
]
load-tests = [
    "locust>=2.20.0",
]
celery = [
    "celery[redis]>=5.3.0",
]
mcp = [
    "fastmcp>=2.0.0",
]

[project.scripts]
modelseed-mcp = "modelseed_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` must stay hermetic: exclude tests/live/ (marked "live" by
# tests/live/conftest.py) so a plain run never makes real network calls to
# production modelseed.org. Opt into the live suite explicitly, e.g.
# `pytest -m live_smoke` (see docs/E2E_TEST_PLAN.md).
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = [
    "unit: Pure function tests, no I/O",
    "integration: Tests with filesystem or temp dirs",
    "e2e: Full stack end-to-end tests",
    "live: Requires external services (PATRIC token)",
    # E2E live suite (see docs/E2E_TEST_PLAN.md)
    "live_smoke: Sub-5-minute reads, no auth or read-only auth, no jobs",
    "live_functional: Auth required, exercises every endpoint, no long jobs",
    "live_biological: Submits real reconstruct/gapfill/FBA jobs and validates biology",
    "live_ui: Playwright tests against deployed Next.js",
    "slow: Test takes >60s alone",
    "flaky_external: Retry-eligible; isolates PATRIC/BV-BRC/SOLR instability",
    "requires_token: Skip if MODELSEED_TEST_TOKEN env var is unset",
    "requires_modeling: Needs cobra/modelseedpy ([modeling] extra)",
]
timeout = 60
timeout_func_only = true
